<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Rabindra X — The Ganga Gang</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--red:#ff3038;--muted:#a7a7a7;--line:#292929}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#4b1014 0,transparent 42%),var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{padding:26px 18px 20px;text-align:center;border-bottom:1px solid var(--line);background:#090909d9}
.brand{font-size:clamp(27px,6vw,44px);font-weight:950;letter-spacing:1.5px;text-transform:uppercase}
.brand span{color:var(--red);text-shadow:0 0 18px #ff303866}
.tag{display:inline-block;margin-top:9px;padding:7px 13px;border:1px solid #8d252a;border-radius:99px;color:#ff7378;font-size:12px;font-weight:800;letter-spacing:2.5px}
.sub{color:var(--muted);font-size:13px;margin:12px 0 0}
main{max-width:1050px;margin:auto;padding:24px 16px 50px}
.toolbar{display:flex;gap:10px;max-width:650px;margin:0 auto 22px}
input{width:100%;background:#141414;border:1px solid #393939;color:white;border-radius:12px;padding:14px 15px;font-size:15px;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ff303822}
.count{color:var(--muted);text-align:center;font-size:12px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card{background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #303030;border-radius:18px;padding:17px;position:relative;overflow:hidden;transition:.2s}
.card:before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.card:hover{transform:translateY(-3px);border-color:#793036;box-shadow:0 12px 30px #0008}
.top{display:flex;gap:13px;align-items:center}
.avatar{width:68px;height:68px;flex:0 0 68px;border-radius:15px;object-fit:cover;background:#242424;border:1px solid #4a292b}
.initial{width:68px;height:68px;flex:0 0 68px;border-radius:15px;background:linear-gradient(145deg,#421317,#191919);display:grid;place-items:center;font-weight:900;font-size:23px;color:#ff777c;border:1px solid #713136}
.name{font-weight:850;font-size:17px;line-height:1.2}.role{color:#ff666c;font-size:10px;font-weight:800;letter-spacing:1.8px;margin-top:6px}
.info{display:grid;gap:8px;margin:16px 0;color:#d7d7d7;font-size:13px}
.info b{color:#888;font-weight:600;display:inline-block;min-width:65px}
.actions{display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;padding:10px 9px;border-radius:10px;font-size:12px;font-weight:800;border:1px solid #464646;color:white;background:#1c1c1c}
.btn.red{background:var(--red);border-color:var(--red);color:white}.btn.disabled{opacity:.45;pointer-events:none}
.empty{display:none;text-align:center;color:var(--muted);padding:35px}
footer{text-align:center;color:#777;font-size:11px;padding:20px;border-top:1px solid var(--line)}
.note{margin:22px auto 0;max-width:750px;border:1px solid #5d4848;background:#1b1515;color:#d8caca;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.5}
@media(max-width:480px){main{padding:18px 12px 35px}.grid{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>

  <div class="brand">Rabindra <span>X</span></div>

</main>

const grid = document.getElementById('profiles');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
document.getElementById('year').textContent = new Date().getFullYear();

function initials(name){return name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function render(){
  const q=search.value.trim().toLowerCase();
  const list=profiles.filter(p=>(p.name+' '+p.location).toLowerCase().includes(q));
  count.textContent=`${list.length} / ${profiles.length} CREW PROFILES`;
  empty.style.display=list.length?'none':'block';
  grid.innerHTML=list.map((p)=>{
    const avatar=p.photo?`<img class="avatar" src="${p.photo}" alt="${p.name} profile photo">`:`<div class="initial" aria-label="Default profile avatar">${initials(p.name)}</div>`;
    const insta=p.instagram?`<a class="btn red" href="${p.instagram}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>`:`<span class="btn disabled">Instagram not added</span>`;
    return `<article class="card"><div class="top">${avatar}<div><div class="name">${p.name}</div><div class="role">GANGA GANG MEMBER</div></div></div><div class="info"><div><b>AGE</b> ${p.age}</div><div><b>LOCATION</b> ${p.location}</div><div><b>INSTAGRAM</b> ${p.handle}</div></div><div class="actions">${insta}</div></article>`;
  }).join('');
}
search.addEventListener('input',render);
